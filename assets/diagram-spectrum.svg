<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="gHot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffedd0"/><stop offset="1" stop-color="#ffdba6"/></linearGradient>
    <linearGradient id="gScale" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#1fae9c"/></linearGradient>
    <filter id="softS" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10443d" flood-opacity="0.12"/></filter>
  </defs>
  <style>
    .name { font-size: 14.5px; font-weight: 700; fill: #17262b; }
    .how  { font-size: 12px; fill: #4f6066; }
    .pill { font-size: 10px; font-weight: 800; letter-spacing: .6px; }
    .grow { transform-origin: left center; transform-box: fill-box; animation: grow .8s cubic-bezier(.22,1,.36,1) both; }
    .g1{animation-delay:.05s}.g2{animation-delay:.2s}.g3{animation-delay:.35s}.g4{animation-delay:.5s}
    @keyframes grow { from{opacity:0; transform:scaleX(0)} to{opacity:1; transform:scaleX(1)} }
    .fade { animation: fade .5s ease both; }
    .f1{animation-delay:.55s}.f2{animation-delay:.7s}.f3{animation-delay:.85s}.f4{animation-delay:1s}.f5{animation-delay:1.15s}
    @keyframes fade { from{opacity:0} to{opacity:1} }
    .glow { animation: gl 2.4s ease-in-out infinite; }
    @keyframes gl { 0%,100%{opacity:0} 50%{opacity:.85} }
    @media (prefers-reduced-motion: reduce) {
      .grow,.fade,.glow { animation: none; }
      .dot { display: none; }
    }
  </style>

  <text x="24" y="16" font-size="10.5" letter-spacing="2.5" font-weight="700" fill="#8595a0">THE AUTONOMY SPECTRUM</text>

  <!-- ascending step guide -->
  <polyline points="324,52 444,110 564,168 704,226" fill="none" stroke="#ecd9b8" stroke-width="2" stroke-dasharray="3 5"/>

  <!-- bar 1: autocomplete -->
  <g class="grow g1">
    <rect x="24" y="28" width="300" height="48" rx="14" fill="#ffffff" stroke="#e3cfae" stroke-width="1.5" filter="url(#softS)"/>
    <circle cx="50" cy="52" r="15" fill="#faf3e4" stroke="#d9b98a" stroke-width="1.5"/>
    <g transform="translate(50 52)" stroke="#b07503" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-2.5 -6 H 2.5 M0 -6 V 6 M-2.5 6 H 2.5"/>
    </g>
    <text class="name" x="76" y="49">Autocomplete</text>
    <text class="how" x="76" y="66">AI suggests, you type</text>
    <g class="fade f1">
      <rect x="238" y="42" width="76" height="20" rx="10" fill="#ffffff" stroke="#d9b98a" stroke-width="1.5"/>
      <text class="pill" x="276" y="55.5" text-anchor="middle" fill="#a8650a">YOU DRIVE</text>
    </g>
  </g>

  <!-- bar 2: chat / ask -->
  <g class="grow g2">
    <rect x="24" y="86" width="420" height="48" rx="14" fill="#fff7ea" stroke="#f0bd6b" stroke-width="1.5" filter="url(#softS)"/>
    <circle cx="50" cy="110" r="15" fill="#fdf0d8" stroke="#eab566" stroke-width="1.5"/>
    <g transform="translate(50 110)" stroke="#b07503" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-6" width="16" height="11" rx="3"/>
      <path d="M-4 5 L-5.5 9 L-1 5"/>
    </g>
    <text class="name" x="76" y="107">Chat / Ask</text>
    <text class="how" x="76" y="124">you ask, AI answers</text>
    <g class="fade f2">
      <rect x="358" y="100" width="76" height="20" rx="10" fill="#ffffff" stroke="#eab566" stroke-width="1.5"/>
      <text class="pill" x="396" y="113.5" text-anchor="middle" fill="#a8650a">YOU DRIVE</text>
    </g>
  </g>

  <!-- bar 3: agent mode (IDE) -->
  <g class="grow g3">
    <rect x="24" y="144" width="540" height="48" rx="14" fill="#e0f7f2" stroke="#1fae9c" stroke-width="1.5" filter="url(#softS)"/>
    <circle cx="50" cy="168" r="15" fill="#ffffff" stroke="#1fae9c" stroke-width="1.5"/>
    <g transform="translate(50 168)" stroke="#0c7a6b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-7" width="16" height="14" rx="2"/>
      <line x1="-8" y1="-3" x2="8" y2="-3"/>
      <path d="M-3.5 0.5 l-2.5 2.5 2.5 2.5 M3.5 0.5 l2.5 2.5 -2.5 2.5"/>
    </g>
    <text class="name" x="76" y="165">Agent mode (IDE)</text>
    <text class="how" x="76" y="182">you pair, approve each step</text>
    <g class="fade f3">
      <rect x="488" y="158" width="66" height="20" rx="10" fill="#ffffff" stroke="#1fae9c" stroke-width="1.5"/>
      <text class="pill" x="521" y="171.5" text-anchor="middle" fill="#0c7a6b">SHARED</text>
    </g>
  </g>

  <!-- bar 4: coding agent -->
  <g class="grow g4">
    <rect class="glow" x="24" y="202" width="680" height="48" rx="14" fill="none" stroke="#ffc35c" stroke-width="3"/>
    <rect x="24" y="202" width="680" height="48" rx="14" fill="url(#gHot)" stroke="#ff9f1c" stroke-width="2" filter="url(#softS)"/>
    <circle cx="50" cy="226" r="15" fill="#ffffff" stroke="#ff9f1c" stroke-width="1.5"/>
    <g transform="translate(50 226)" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -9 C 3.5 -6, 4 -1, 2.5 3 L -2.5 3 C -4 -1, -3.5 -6, 0 -9 Z"/>
      <circle cx="0" cy="-3" r="1.2" fill="#e08a00" stroke="none"/>
      <path d="M-2.5 2 L -5.5 6 L -2 5.2 M2.5 2 L 5.5 6 L 2 5.2"/>
      <path d="M0 4.5 C 1 6, 1 7.5, 0 9 C -1 7.5, -1 6, 0 4.5 Z" fill="#ff9f1c" stroke="none"/>
    </g>
    <text class="name" x="76" y="223">Coding Agent</text>
    <text class="how" x="76" y="240">you delegate, AI drives to a PR</text>
    <g class="fade f4">
      <rect x="622" y="216" width="72" height="20" rx="10" fill="#ff9f1c"/>
      <text class="pill" x="658" y="229.5" text-anchor="middle" fill="#ffffff">AI DRIVES</text>
    </g>
  </g>

  <!-- who-drives scale -->
  <g class="fade f5">
    <line x1="792" y1="52" x2="792" y2="214" stroke="url(#gScale)" stroke-width="3" stroke-linecap="round"/>
    <path d="M785 208 H 799 L 792 224 Z" fill="#1fae9c"/>
  </g>
  <circle class="fade f1" cx="792" cy="52" r="5.5" fill="#fff" stroke="#ff9f1c" stroke-width="2"/>
  <circle class="fade f2" cx="792" cy="110" r="5.5" fill="#fff" stroke="#f0bd6b" stroke-width="2"/>
  <circle class="fade f3" cx="792" cy="168" r="5.5" fill="#fff" stroke="#1fae9c" stroke-width="2"/>
  <circle class="dot" cx="792" cy="52" r="4" fill="#10443d">
    <animateMotion dur="3s" begin="1.4s" repeatCount="indefinite" path="M792 52 V 210"/>
  </circle>
  <text transform="rotate(90 818 133)" x="818" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#a8650a">who drives: you → AI</text>
</svg>
