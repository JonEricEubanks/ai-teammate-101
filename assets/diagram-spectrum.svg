<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" font-family="Inter,Segoe UI,Arial,sans-serif">
  <style>
    .bar { animation: grow .9s cubic-bezier(.22,1,.36,1) both; transform-origin:left center; transform-box: fill-box; }
    .b1{animation-delay:.05s}.b2{animation-delay:.2s}.b3{animation-delay:.35s}.b4{animation-delay:.5s}
    @keyframes grow { from{opacity:0; transform:scaleX(0)} to{opacity:1; transform:scaleX(1)} }
    .name { font-size:14.5px; font-weight:700; fill:#2b2135 }
    .how  { font-size:12px; fill:#5c5468 }
    .you  { font-size:11.5px; font-weight:600; fill:#a8650a }
  </style>

  <!-- increasing autonomy = increasing bar length + a marker showing "who drives" -->
  <g class="bar b1">
    <rect x="20" y="30" width="180" height="46" rx="12" fill="#fff" stroke="#e0c9a6"/>
    <text class="name" x="34" y="50">Autocomplete</text>
    <text class="how" x="34" y="66">AI suggests, you type</text>
  </g>
  <g class="bar b2">
    <rect x="20" y="86" width="320" height="46" rx="12" fill="#fff" stroke="#e0c9a6"/>
    <text class="name" x="34" y="106">Chat / Ask</text>
    <text class="how" x="34" y="122">you ask, AI answers</text>
  </g>
  <g class="bar b3">
    <rect x="20" y="142" width="470" height="46" rx="12" fill="#f3e8ff" stroke="#8a63d2"/>
    <text class="name" x="34" y="162">Agent mode (IDE)</text>
    <text class="how" x="34" y="178">you pair, approve each step</text>
  </g>
  <g class="bar b4">
    <rect x="20" y="198" width="620" height="40" rx="12" fill="#ffe9c7" stroke="#ff9f1c"/>
    <text class="name" x="34" y="223">Coding Agent — you delegate, AI drives to a PR</text>
  </g>

  <!-- autonomy arrow on the right -->
  <g>
    <line x1="760" y1="40" x2="760" y2="220" stroke="#c9a25e" stroke-width="2.5"/>
    <path d="M760 30 l-7 12 h14 z" fill="#c9a25e" transform="rotate(180 760 36)"/>
    <path d="M760 230 l-7 -12 h14 z" fill="#c9a25e"/>
    <text x="782" y="134" font-size="12.5" fill="#a8650a" font-weight="700" transform="rotate(90 782 134)">who drives: you → AI</text>
  </g>
</svg>
