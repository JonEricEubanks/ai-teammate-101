<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="gYou" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#ffe9c7"/></linearGradient>
    <linearGradient id="gBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaf6"/><stop offset="1" stop-color="#cdf0e7"/></linearGradient>
    <linearGradient id="gOk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#effaf2"/><stop offset="1" stop-color="#d3f0dc"/></linearGradient>
    <linearGradient id="gMedal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc35c"/><stop offset="1" stop-color="#ff7b1c"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10443d" flood-opacity="0.14"/></filter>
    <marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e08a00"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1fae9c"/></marker>
  </defs>

  <style>
    .face { stroke-width: 2; }
    .ttl  { font-size: 16.5px; font-weight: 700; }
    .sub  { font-size: 12.5px; opacity: .78; }
    .num  { font-size: 12px; font-weight: 800; fill: #fff; }
    .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; }
    .d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.31s}.d4{animation-delay:.44s}.d5{animation-delay:.58s}.d6{animation-delay:.72s}
    @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
    .flow  { fill:none; stroke:#e08a00; stroke-width:3; stroke-linecap:round; stroke-dasharray:1 8; animation:dash 1s linear infinite; }
    .flowT { fill:none; stroke:#1fae9c; stroke-width:3; stroke-linecap:round; stroke-dasharray:1 8; animation:dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -9; } }
    .bob  { animation: bob 3.2s ease-in-out infinite; }
    .bob2 { animation: bob 3.2s ease-in-out infinite .7s; }
    @keyframes bob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-3px) } }
    .pulseMedal { transform-origin: 490px 318px; animation: pm 2.6s ease-in-out infinite; }
    @keyframes pm { 0%,100%{ transform: scale(1) } 50%{ transform: scale(1.06) } }
    .shine { transform-origin: 490px 318px; animation: spin 5.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) {
      .rise,.flow,.flowT,.bob,.bob2,.pulseMedal,.shine { animation: none; }
      .dot { display: none; }
    }
  </style>

  <!-- connectors (behind cards) -->
  <g class="rise d2">
    <path class="flow" d="M202 116 H 256" marker-end="url(#arM)"/>
    <circle class="dot" cx="202" cy="116" r="4.5" fill="#ff7b1c"><animateMotion dur="1.5s" repeatCount="indefinite" path="M202 116 H 256"/></circle>
  </g>
  <g class="rise d3">
    <path class="flow" d="M462 116 H 520" marker-end="url(#arM)"/>
    <circle class="dot" cx="462" cy="116" r="4.5" fill="#ff7b1c"><animateMotion dur="1.5s" repeatCount="indefinite" path="M462 116 H 520"/></circle>
  </g>
  <g class="rise d4">
    <path class="flow" d="M726 116 H 780" marker-end="url(#arM)"/>
    <circle class="dot" cx="726" cy="116" r="4.5" fill="#ff7b1c"><animateMotion dur="1.5s" repeatCount="indefinite" path="M726 116 H 780"/></circle>
  </g>

  <!-- review feedback loop -->
  <g class="rise d5">
    <path class="flowT" d="M627 176 C 592 252, 402 252, 363 176" marker-end="url(#arT)"/>
    <circle class="dot" cx="627" cy="176" r="4.5" fill="#0c7a6b"><animateMotion dur="2.8s" repeatCount="indefinite" path="M627 176 C 592 252, 402 252, 363 176"/></circle>
    <rect x="420" y="220" width="150" height="26" rx="13" fill="#f2fbf9" stroke="#1fae9c" stroke-width="1.5"/>
    <text x="495" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#0c7a6b">feedback → @copilot</text>
  </g>

  <!-- card 1: you -->
  <g class="rise d1">
    <rect class="face" x="28" y="64" width="170" height="104" rx="16" fill="url(#gYou)" stroke="#ff9f1c" filter="url(#soft)"/>
    <circle cx="42" cy="64" r="12" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="42" y="68.5" text-anchor="middle">1</text>
    <circle cx="113" cy="98" r="19" fill="#fff" stroke="#ff9f1c" stroke-width="2"/>
    <g transform="translate(113 98)"><g class="bob" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6.5 6.5 L-4.8 1.8 L5.5 -8.5 A2.4 2.4 0 0 1 8.5 -5.5 L-1.8 4.8 Z"/>
    </g></g>
    <text class="ttl" x="113" y="138" text-anchor="middle" fill="#8a5a00">You</text>
    <text class="sub" x="113" y="156" text-anchor="middle" fill="#8a5a00">write a crisp issue</text>
  </g>

  <!-- card 2: agent -->
  <g class="rise d2">
    <rect class="face" x="268" y="64" width="190" height="104" rx="16" fill="url(#gBot)" stroke="#1fae9c" filter="url(#soft)"/>
    <circle cx="282" cy="64" r="12" fill="#1fae9c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="282" y="68.5" text-anchor="middle">2</text>
    <circle cx="363" cy="98" r="19" fill="#fff" stroke="#1fae9c" stroke-width="2"/>
    <g transform="translate(363 98)"><g class="bob2" stroke="#0c7a6b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-5" width="16" height="12" rx="3.5"/>
      <line x1="0" y1="-5" x2="0" y2="-9"/>
      <circle cx="0" cy="-10.5" r="1.4" fill="#0c7a6b" stroke="none"/>
      <circle cx="-3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <circle cx="3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <line x1="-8" y1="1" x2="-11" y2="1"/>
      <line x1="8" y1="1" x2="11" y2="1"/>
    </g></g>
    <text class="ttl" x="363" y="138" text-anchor="middle" fill="#0c7a6b">Coding Agent</text>
    <text class="sub" x="363" y="156" text-anchor="middle" fill="#0c7a6b">works autonomously</text>
  </g>

  <!-- card 3: review -->
  <g class="rise d3">
    <rect class="face" x="532" y="64" width="190" height="104" rx="16" fill="url(#gYou)" stroke="#ff9f1c" filter="url(#soft)"/>
    <circle cx="546" cy="64" r="12" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="546" y="68.5" text-anchor="middle">3</text>
    <circle cx="627" cy="98" r="19" fill="#fff" stroke="#ff9f1c" stroke-width="2"/>
    <g transform="translate(627 98)"><g class="bob" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9 0 C -5 -5.5, 5 -5.5, 9 0 C 5 5.5, -5 5.5, -9 0 Z"/>
      <circle cx="0" cy="0" r="2.4"/>
    </g></g>
    <text class="ttl" x="627" y="138" text-anchor="middle" fill="#8a5a00">You review</text>
    <text class="sub" x="627" y="156" text-anchor="middle" fill="#8a5a00">the pull request</text>
  </g>

  <!-- card 4: merge -->
  <g class="rise d4">
    <rect class="face" x="792" y="64" width="160" height="104" rx="16" fill="url(#gOk)" stroke="#2ea043" filter="url(#soft)"/>
    <circle cx="806" cy="64" r="12" fill="#2ea043" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="806" y="68.5" text-anchor="middle">4</text>
    <circle cx="872" cy="98" r="19" fill="#fff" stroke="#2ea043" stroke-width="2"/>
    <g transform="translate(872 98)"><g class="bob2" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="-6" cy="-5.5" r="2.4"/>
      <circle cx="-6" cy="5.5" r="2.4"/>
      <circle cx="6" cy="0" r="2.4"/>
      <path d="M-3.6 -5.5 C 0 -5.5, 0 0, 3.4 0"/>
      <path d="M-3.6 5.5 C 0 5.5, 0 0, 3.4 0"/>
    </g></g>
    <text class="ttl" x="872" y="138" text-anchor="middle" fill="#1a7f37">Merge</text>
    <text class="sub" x="872" y="156" text-anchor="middle" fill="#1a7f37">milestone ✓</text>
  </g>

  <!-- certificate -->
  <g class="rise d6">
    <path class="flow" style="stroke:#ff9f1c" stroke-dasharray="1 7" d="M872 176 C 855 300, 650 322, 524 319" marker-end="url(#arM)"/>
    <text x="490" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a8650a">6/6 milestones → certificate</text>
    <g class="pulseMedal">
      <path d="M480 336 L473 356 L483 350 L490 360 L497 350 L507 356 L500 336 Z" fill="#ff7b1c"/>
      <circle cx="490" cy="318" r="24" fill="url(#gMedal)" stroke="#e08a00" stroke-width="2"/>
      <path d="M480 318 l7 7 13 -13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="shine" d="M490 294 a24 24 0 0 1 20.5 11.5" stroke="#fff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    </g>
  </g>
</svg>
