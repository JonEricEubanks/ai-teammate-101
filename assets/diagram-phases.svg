<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <filter id="softP" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10443d" flood-opacity="0.15"/></filter>
  </defs>
  <style>
    .t { font-size: 15.5px; font-weight: 700; fill: #17262b; }
    .d { font-size: 12px; fill: #4f6066; }
    .num { font-size: 11px; font-weight: 800; fill: #fff; }
    .pop { animation: pop .55s cubic-bezier(.22,1,.36,1) both; transform-origin: center; transform-box: fill-box; }
    .p1{animation-delay:.25s}.p2{animation-delay:.5s}.p3{animation-delay:.75s}.p4{animation-delay:1s}.p5{animation-delay:2s}
    @keyframes pop { from{opacity:0; transform:scale(.4)} to{opacity:1; transform:scale(1)} }
    .prog { stroke-dasharray: 730; stroke-dashoffset: 730; animation: draw 1.7s .35s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rip { fill:none; stroke:#1fae9c; stroke-width:2; opacity:0; animation: ripple 2.6s ease-out infinite; transform-origin:center; transform-box:fill-box; }
    .rip2 { animation-delay: 1.3s; }
    @keyframes ripple { 0%{opacity:.6; transform:scale(.7)} 100%{opacity:0; transform:scale(1.6)} }
    @media (prefers-reduced-motion: reduce) {
      .pop { animation: none; }
      .prog { stroke-dashoffset: 0; animation: none; }
      .rip,.rip2,.dot { display: none; }
    }
  </style>

  <!-- timeline -->
  <line x1="110" y1="104" x2="830" y2="104" stroke="#dcebe6" stroke-width="5" stroke-linecap="round"/>
  <path class="prog" d="M110 104 H 830" stroke="#1fae9c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle class="dot" cx="110" cy="104" r="6" fill="#ff9f1c" stroke="#fff" stroke-width="2">
    <animateMotion dur="3.2s" begin="2.3s" repeatCount="indefinite" path="M110 104 H 830"/>
  </circle>
  <path class="pop p5" d="M840 96 L858 104 L840 112 Z" fill="#1fae9c"/>

  <!-- step 1: assignment -->
  <g class="pop p1">
    <circle cx="110" cy="104" r="30" fill="#fff" stroke="#ff9f1c" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(110 104)" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="-7" y="-9" width="14" height="18" rx="2.5"/>
      <line x1="-3.5" y1="-3.5" x2="3.5" y2="-3.5"/>
      <line x1="-3.5" y1="0.5" x2="3.5" y2="0.5"/>
      <line x1="-3.5" y1="4.5" x2="0.5" y2="4.5"/>
    </g>
    <circle cx="132" cy="82" r="11" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="132" y="86" text-anchor="middle">1</text>
    <text class="t" x="110" y="172" text-anchor="middle">Assignment</text>
    <text class="d" x="110" y="192" text-anchor="middle">issue → @copilot</text>
    <text class="d" x="110" y="209" text-anchor="middle">adds a 👀 reaction</text>
  </g>

  <!-- step 2: autonomous dev -->
  <g class="pop p2">
    <circle class="rip" cx="350" cy="104" r="30"/>
    <circle class="rip rip2" cx="350" cy="104" r="30"/>
    <circle cx="350" cy="104" r="30" fill="#fff" stroke="#1fae9c" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(350 104)" stroke="#0c7a6b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-5" width="16" height="12" rx="3.5"/>
      <line x1="0" y1="-5" x2="0" y2="-9"/>
      <circle cx="0" cy="-10.5" r="1.4" fill="#0c7a6b" stroke="none"/>
      <circle cx="-3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <circle cx="3.4" cy="0.5" r="1.3" fill="#0c7a6b" stroke="none"/>
      <line x1="-8" y1="1" x2="-11" y2="1"/>
      <line x1="8" y1="1" x2="11" y2="1"/>
    </g>
    <circle cx="372" cy="82" r="11" fill="#1fae9c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="372" y="86" text-anchor="middle">2</text>
    <text class="t" x="350" y="172" text-anchor="middle">Autonomous dev</text>
    <text class="d" x="350" y="192" text-anchor="middle">plans, branches,</text>
    <text class="d" x="350" y="209" text-anchor="middle">commits incrementally</text>
  </g>

  <!-- step 3: quality check -->
  <g class="pop p3">
    <circle cx="590" cy="104" r="30" fill="#fff" stroke="#ff9f1c" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(590 104)" stroke="#e08a00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -9 L7 -6.5 V0.5 C7 5, 3.5 7.5, 0 9.5 C -3.5 7.5, -7 5, -7 0.5 V-6.5 Z"/>
      <path d="M-3 0.5 l2.2 2.2 4.2 -4.7"/>
    </g>
    <circle cx="612" cy="82" r="11" fill="#ff9f1c" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="612" y="86" text-anchor="middle">3</text>
    <text class="t" x="590" y="172" text-anchor="middle">Quality check</text>
    <text class="d" x="590" y="192" text-anchor="middle">runs tests &amp; linters</text>
    <text class="d" x="590" y="209" text-anchor="middle">documents reasoning</text>
  </g>

  <!-- step 4: PR &amp; review -->
  <g class="pop p4">
    <circle cx="830" cy="104" r="30" fill="#fff" stroke="#2ea043" stroke-width="2.5" filter="url(#softP)"/>
    <g transform="translate(830 104)" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="-6" cy="-6" r="2.6"/>
      <circle cx="6" cy="6" r="2.6"/>
      <line x1="-6" y1="-3.4" x2="-6" y2="9"/>
      <path d="M1 -6 H 3.4 C 5 -6, 6 -5, 6 -3.4 V 3.4"/>
    </g>
    <circle cx="852" cy="82" r="11" fill="#2ea043" stroke="#fff" stroke-width="2.5"/>
    <text class="num" x="852" y="86" text-anchor="middle">4</text>
    <text class="t" x="830" y="172" text-anchor="middle">PR &amp; review</text>
    <text class="d" x="830" y="192" text-anchor="middle">draft PR + session logs</text>
    <text class="d" x="830" y="209" text-anchor="middle">iterates on feedback</text>
  </g>
</svg>
