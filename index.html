<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Teammate 101 — Delegate Like a Tech Lead</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="A hands-on workshop for learning to delegate work to GitHub Copilot's Coding Agent."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🥭</text></svg>"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <link rel="stylesheet" href="assets/theme.css?v=3" />
    <link rel="stylesheet" href="assets/cover.css?v=3" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "🥭 AI Teammate 101",
        repo: "https://github.com/JonEricEubanks/ai-teammate-101",
        loadSidebar: true,
        coverpage: true,
        auto2top: true,
        search: "auto",
        copyCode: {
          buttonText: "Copy",
          errorText: "Error",
          successText: "Copied",
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script type="module">
      // Render ```mermaid code fences as real diagrams
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({ startOnLoad: false, theme: "neutral" });

      const renderMermaid = async () => {
        document
          .querySelectorAll('pre[data-lang="mermaid"]')
          .forEach(async (pre, i) => {
            if (pre.dataset.rendered) return;
            const code = pre.querySelector("code")?.textContent ?? "";
            try {
              const { svg } = await mermaid.render(
                `mmd-${Date.now()}-${i}`,
                code,
              );
              const holder = document.createElement("div");
              holder.className = "mermaid-diagram";
              holder.innerHTML = svg;
              holder.style.cssText = "text-align:center;margin:1.2em 0;";
              pre.replaceWith(holder);
              holder.dataset.rendered = "true";
            } catch {
              /* leave the source visible if a diagram fails */
            }
          });
      };

      window.$docsify.plugins = (window.$docsify.plugins || []).concat((hook) =>
        hook.doneEach(renderMermaid),
      );
    </script>
  </body>
</html>
